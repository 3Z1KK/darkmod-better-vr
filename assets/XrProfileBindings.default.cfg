// "main" = dominant hand (right by default, see vr_inputLefthanded), "off" = other hand

// --- Meta Quest Touch / Touch Plus (Quest 2, 3, Pro) ---
xr_profile touch "/interaction_profiles/oculus/touch_controller"
// hands: grip pose, grip squeeze and trigger of both hands (grab / use held item)
xr_bind touch hand_pose "/user/hand/left/input/grip/pose"
xr_bind touch hand_grip "/user/hand/left/input/squeeze/value"
xr_bind touch hand_trigger "/user/hand/left/input/trigger/value"
xr_bind touch hand_pose "/user/hand/right/input/grip/pose"
xr_bind touch hand_grip "/user/hand/right/input/squeeze/value"
xr_bind touch hand_trigger "/user/hand/right/input/trigger/value"
xr_bind touch side "/user/hand/off/input/thumbstick/x"
xr_bind touch forward "/user/hand/off/input/thumbstick/y"
xr_bind touch move_dir_hand "/user/hand/off/input/aim/pose"
xr_bind touch sprint "/user/hand/off/input/thumbstick/click"
xr_bind touch yaw "/user/hand/main/input/thumbstick/x"
xr_bind touch inventory_open "/user/hand/main/input/thumbstick/click"
xr_bind touch jump "/user/hand/main/input/a/click"
xr_bind touch crouch "/user/hand/main/input/b/click"
xr_bind touch aim "/user/hand/main/input/aim/pose"
xr_bind touch drop_item "/user/hand/off/input/a/click"
xr_bind touch menu_open "/user/hand/left/input/menu/click"
xr_bind touch menu_aim "/user/hand/left/input/aim/pose"
xr_bind touch menu_aim "/user/hand/right/input/aim/pose"
xr_bind touch menu_click "/user/hand/left/input/trigger/value"
xr_bind touch menu_click "/user/hand/right/input/trigger/value"
xr_bind touch menu_escape "/user/hand/left/input/y/click"
xr_bind touch menu_escape "/user/hand/right/input/b/click"

// --- Valve Index ---
xr_profile index "/interaction_profiles/valve/index_controller"
// hands: grip pose, grip squeeze and trigger of both hands (grab / use held item)
xr_bind index hand_pose "/user/hand/left/input/grip/pose"
xr_bind index hand_grip "/user/hand/left/input/squeeze/value"
xr_bind index hand_trigger "/user/hand/left/input/trigger/value"
xr_bind index hand_pose "/user/hand/right/input/grip/pose"
xr_bind index hand_grip "/user/hand/right/input/squeeze/value"
xr_bind index hand_trigger "/user/hand/right/input/trigger/value"
xr_bind index side "/user/hand/off/input/thumbstick/x"
xr_bind index forward "/user/hand/off/input/thumbstick/y"
xr_bind index move_dir_hand "/user/hand/off/input/aim/pose"
xr_bind index yaw "/user/hand/main/input/thumbstick/x"
xr_bind index pitch "/user/hand/main/input/thumbstick/y"
xr_bind index sprint "/user/hand/off/input/thumbstick/click"
xr_bind index jump "/user/hand/main/input/a/click"
xr_bind index crouch "/user/hand/main/input/thumbstick/click"
xr_bind index menu_open "/user/hand/off/input/trackpad/force"
xr_bind index aim "/user/hand/main/input/aim/pose"
xr_bind index inventory_open "/user/hand/main/input/trackpad/force"
xr_bind index drop_item "/user/hand/off/input/b/click"
xr_bind index menu_aim "/user/hand/left/input/aim/pose"
xr_bind index menu_aim "/user/hand/right/input/aim/pose"
xr_bind index menu_click "/user/hand/left/input/trigger/value"
xr_bind index menu_click "/user/hand/right/input/trigger/value"
xr_bind index menu_escape "/user/hand/left/input/b/click"
xr_bind index menu_escape "/user/hand/right/input/b/click"
