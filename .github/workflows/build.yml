name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Cache third-party libraries
        id: cache-artefacts
        uses: actions/cache@v4
        with:
          path: ThirdParty/artefacts
          key: artefacts-release214-v1

      - name: Download third-party libraries from TDM SVN
        if: steps.cache-artefacts.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          choco install svn -y --no-progress
          $svn = Get-ChildItem -Recurse -Filter svn.exe "C:\Program Files\SlikSvn","C:\ProgramData\chocolatey\bin" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $svn) { $svn = Get-Command svn }
          & $svn.FullName export --force --non-interactive https://svn.thedarkmod.com/publicsvn/darkmod_src/branches/release214/ThirdParty/artefacts ThirdParty/artefacts
          if (-not (Test-Path ThirdParty/artefacts/windows_64)) { Get-ChildItem ThirdParty/artefacts; throw "artefacts missing windows_64" }

      - name: Add VR third-party libraries
        shell: pwsh
        run: |
          if (Test-Path vr_thirdparty) {
            Copy-Item -Recurse -Force vr_thirdparty/* ThirdParty/artefacts/
          }

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release x64
        run: msbuild TheDarkMod.sln -m -p:Configuration=Release -p:Platform=x64 -v:minimal

      - name: Collect build
        shell: pwsh
        run: |
          $out = "dist"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item ..\darkmod\*.exe $out
          Copy-Item ..\darkmod\*.dll $out -ErrorAction SilentlyContinue
          Copy-Item ..\darkmod\*.pdb $out -ErrorAction SilentlyContinue
          if (Test-Path ..\darkmod\glprogs) { Copy-Item -Recurse ..\darkmod\glprogs $out\glprogs }
          if (Test-Path vr_assets) { Copy-Item -Recurse vr_assets\* $out }
          Get-ChildItem -Recurse $out | Select-Object FullName, Length

      - uses: actions/upload-artifact@v4
        with:
          name: darkmod-vr-build
          path: dist
